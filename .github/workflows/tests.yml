name: Atlas tests

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: node --check app.mjs && node --check details.mjs && node --check facts.mjs && node --check search.mjs
      - name: Run tests
        run: node --test *.test.mjs
